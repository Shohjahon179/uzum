<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>MarketDay</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash">
  <div class="logo-pop">🛍️</div>
  <h1>MarketDay</h1>
  <p>Eng yaxshi narxlar, tez yetkazib berish</p>
  <div class="loader"></div>
</div>

<div id="auth" class="hidden">
  <div class="auth-top">
    <div class="auth-logo">🛍️</div>
    <h2>MarketDay</h2>
    <p>Xush kelibsiz!</p>
  </div>
  <div class="auth-card">
    <div class="tabs">
      <button id="tabLogin" class="active">Kirish</button>
      <button id="tabReg">Ro'yxatdan o'tish</button>
      <span class="ind"></span>
    </div>
    <form id="loginForm">
      <label>Telefon raqam<input id="lPhone" type="tel" placeholder="+998 90 123 45 67" autocomplete="tel"></label>
      <label>Parol<input id="lPass" type="password" placeholder="••••••" autocomplete="current-password"></label>
      <button class="btn" type="submit">Kirish</button>
    </form>
    <form id="regForm" class="hidden">
      <label>Ism familiya<input id="rName" type="text" placeholder="Ismingiz"></label>
      <label>Telefon raqam<input id="rPhone" type="tel" placeholder="+998 90 123 45 67"></label>
      <label>Parol<input id="rPass" type="password" placeholder="Kamida 6 belgi"></label>
      <label>Parolni takrorlang<input id="rPass2" type="password" placeholder="••••••"></label>
      <button class="btn" type="submit">Ro'yxatdan o'tish</button>
    </form>
    <p id="authErr" class="err"></p>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="hello">Salom, <b id="hName"></b> 👋</div>
    <div class="loc">📍 Toshkent</div>
  </header>
  <main><div id="view" class="view"></div></main>
  <nav>
    <button data-tab="home" class="active"><i>🏠</i><span>Asosiy</span></button>
    <button data-tab="favs"><i>❤️</i><span>Sevimli</span></button>
    <button data-tab="cart"><i>🛒</i><span>Savat</span><em id="badge" class="badge hidden">0</em></button>
    <button data-tab="profile"><i>👤</i><span>Profil</span></button>
  </nav>
</div>

<div id="overlay" class="hidden"></div>
<div id="sheet" class="hidden"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
